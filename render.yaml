services:
  - type: web
    name: social-recipe-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Required for the server-side import fallback and thumbnail re-hosting.
      # Previously undeclared, so those features failed silently in production.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      # Comma-free regex of allowed browser origins.
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
      # Optional: Netscape cookies.txt content for yt-dlp, to get past
      # YouTube's datacenter-IP bot checks (export from a logged-in browser).
      - key: YTDLP_COOKIES
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "20"
    plan: free
